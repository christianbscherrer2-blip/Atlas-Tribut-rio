name: Atualizar radar oficial

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Consultar feed público oficial
        run: python scripts/update_news.py
      - name: Publicar alterações do radar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          if git diff --cached --quiet; then
            echo "Sem alterações no radar."
          else
            git commit -m "Atualiza radar de publicações oficiais"
            git push
          fi
