name: Atualizar radar oficial

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Consultar feed público oficial
        id: noticias
        continue-on-error: true
        run: python scripts/update_news.py
      - name: Atualizar a Selic mensal (Banco Central, série 4390)
        id: selic
        continue-on-error: true
        run: python scripts/update_selic.py
      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json selic.json
          if git diff --cached --quiet; then
            echo "Sem alterações no radar nem na Selic."
          else
            git commit -m "Atualiza radar de publicações oficiais e Selic"
            git push
          fi
      - name: Sinalizar fonte que falhou
        if: steps.noticias.outcome == 'failure' || steps.selic.outcome == 'failure'
        run: |
          echo "Radar: ${{ steps.noticias.outcome }} · Selic: ${{ steps.selic.outcome }}"
          exit 1
